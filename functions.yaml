functions:
  - name: greeting
    runtime: nodejs
    path: /api/greeting
    method: GET
    timeout: 30
    file: src/js/hello.js

  - name: system-status
    runtime: python
    path: /api/status
    method: GET
    timeout: 30
    file: src/python/status.py

  - name: hello-go
    runtime: go
    path: /api/go
    method: GET
    timeout: 30
    file: src/go/handler.go

  - name: hello-rust
    runtime: rust
    path: /api/rust
    method: GET
    timeout: 30
    file: src/rust/handler.rs
