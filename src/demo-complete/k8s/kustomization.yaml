apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-fission-1

resources:
  # Base de données PostgreSQL opérée par CloudNativePG (1 instance)
  - cnpg-cluster.yaml
  # Application Frontend Web & BFF Go
  - frontend-deployment.yaml
  - frontend-service.yaml
  - frontend-ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: demo-complete
      app.kubernetes.io/managed-by: kustomize
